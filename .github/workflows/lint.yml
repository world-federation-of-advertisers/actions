name: Lint

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint changed files
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
    - name: Check out revision
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Lint
      uses: ./lint
      with:
        license-type: apache
        copyright-holder: The Cross-Media Measurement Authors
